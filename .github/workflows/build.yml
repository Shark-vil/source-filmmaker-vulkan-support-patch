name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME } else { $v = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          .\build.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: SFM_Vulkan_Patcher
          path: |
            build/SFM_Vulkan_Patcher.exe
            build/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME build/SFM_Vulkan_Patcher.exe build/SHA256SUMS.txt `
            --title "SFM Vulkan Patcher $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
